<div class="countdown center-align" data-target="{{ first_event.start_time|date:'c' }}">

  <div class="timer-values">
    <div><h5 class="red-text text-darken-3" id="days">0</h5><small>Days</small></div>
    <div><h5 class="red-text text-darken-3" id="hours">00</h5><small>Hours</small></div>
    <div><h5 class="red-text text-darken-3" id="minutes">00</h5><small>Minutes</small></div>
    <div><h5 class="red-text text-darken-3" id="seconds">00</h5><small>Seconds</small></div>
  </div>
</div>

<style>
.countdown .timer-values {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1.5rem;
  margin-top: 1rem;
}
.countdown .timer-values div {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.countdown span {
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1;
  color: #212121;
  font-variant-numeric: tabular-nums;
}
.countdown small {
  font-size: .8rem;
  color: #757575;
  text-transform: uppercase;
  letter-spacing: .05em;
}
</style>

<script>
(() => {
  const el = document.querySelector('.countdown');
  if (!el) return;

  const target = new Date(el.dataset.target).getTime();
  const d = el.querySelector('#days'),
        h = el.querySelector('#hours'),
        m = el.querySelector('#minutes'),
        s = el.querySelector('#seconds');

  const update = () => {
    const now = Date.now();
    let diff = Math.max(0, Math.floor((target - now) / 1000));

    const days = Math.floor(diff / 86400);
    diff %= 86400;
    const hours = Math.floor(diff / 3600);
    diff %= 3600;
    const mins = Math.floor(diff / 60);
    const secs = diff % 60;

    d.textContent = days;
    h.textContent = hours.toString().padStart(2, "0");
    m.textContent = mins.toString().padStart(2, "0");
    s.textContent = secs.toString().padStart(2, "0");

    if (target - now <= 0) {
      clearInterval(timer);
      el.innerHTML = "<h6 class='red-text text-darken-2'>Event Started!</h6>";
    }
  };

  update();
  const timer = setInterval(update, 1000);
})();
</script>
