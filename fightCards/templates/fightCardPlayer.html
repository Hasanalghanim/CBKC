{% extends "base.html" %} {% block content %}



  <style>
    .iframe-container {
      position: relative;
      width: 100%; /* Full width of the parent container */
      padding-bottom: 56.25%; /* 16:9 aspect ratio (360/640 = 0.5625 -> 56.25%) */
      height: 0;
      overflow: hidden;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>


<meta name="description" content="{{ meta_description }}" />

<div class="headerBackground" style="background-image: url('{{ event.banner.url }}');">


	
	<div class="landingPageMainQuote">
		<div class="heroEventDetail container">
			  <div class="iframe-container">
			<iframe src={{event.playerUrl}} allowFullScreen="1" frameBorder="0"></iframe>
			  </div>
		</div>
	</div>

	<div class="backgroundPhotoCover"></div>

	<div class="heroSignature">
		<h1>Canadian</h1>
		<h1>Bareknuckle</h1>
		<h1>Championship</h1>
	</div>
</div>



{% endblock %}
