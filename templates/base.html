{% load static %}
{% load compress %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Canadian Bare Knuckle Championship{% endblock %}</title>

		<!-- Google Fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Exo+2:wght@400;700&family=Montserrat:wght@400;600&family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Materialize CSS -->
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />

		<!-- Custom Theme CSS -->

		{% compress css %}
		<link rel="stylesheet" href="{% static 'css/theme.css' %}" />
		<link rel="stylesheet" href="{% static 'css/pages/home.css' %}" />
		<link rel="stylesheet" href="{% static 'css/pages/fightCardDetail.css' %}" />
		<link rel="stylesheet" href="{% static 'css/pages/allCards.css' %}" />
		<link rel="stylesheet" href="{% static 'css/pages/tryoutRegister.css' %}" />
		{% endcompress %}
	</head>
	<body>
		{% include 'includes/navbar.html' %}

		<main class="mainGrid">{% block content %}{% endblock %}</main>

		{% include 'includes/footer.html' %}

		<!-- Materialize JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

		<script>
			document.addEventListener('DOMContentLoaded', function () {
				var elems = document.querySelectorAll('.sidenav');
				var instances = M.Sidenav.init(elems);
			});
		</script>
	</body>
</html>
