{% extends "base.html" %}



{% block content %}

<div class="container cbkc-card tryout-registration-card">
    <h3 class=" grey-text darken-4 center-align ">Register for a Tryout</h3>

    <form method="POST" enctype="multipart/form-data" class="cbkc-form">
        {% csrf_token %}

        <!-- Tryout Event Dropdown -->
        <div class="input-field">
            {{ form.tryout_event }}
            <label for="{{ form.tryout_event.id_for_label }}">Select a Tryout Event</label>
        </div>

        <!-- Name Row -->
        <div class="row">
            <div class="input-field col s12 m6">
                {{ form.first_name }}
                <label for="{{ form.first_name.id_for_label }}">First Name</label>
            </div>
            <div class="input-field col s12 m6">
                {{ form.last_name }}
                <label for="{{ form.last_name.id_for_label }}">Last Name</label>
            </div>
        </div>

        <!-- Contact Row -->
        <div class="row">
            <div class="input-field col s12 m6">
                {{ form.email }}
                <label for="{{ form.email.id_for_label }}">Email</label>
            </div>
            <div class="input-field col s12 m6">
                {{ form.phone }}
                <label for="{{ form.phone.id_for_label }}">Phone Number</label>
            </div>
        </div>

        <!-- Optional Info Row -->
        <div class="row">
            <div class="input-field col s12 m6">
                {{ form.weight_class }}
                <label for="{{ form.weight_class.id_for_label }}">Weight Class</label>
            </div>
            <div class="input-field col s12 m6">
                {{ form.experience_years }}
                <label for="{{ form.experience_years.id_for_label }}">Years of Experience</label>
            </div>
        </div>

        <!-- Image Upload -->
        <div class="file-field input-field">
            <div class="btn cbkc-btn">
                <span>Upload Image</span>
                {{ form.image }}
            </div>
            <div class="file-path-wrapper">
                <input class="file-path validate" type="text" placeholder="Upload your picture">
            </div>
        </div>

        <!-- Submit Button -->
        <div class="center-align">
            <button type="submit" class="btn cbkc-btn waves-effect waves-light">Submit Registration</button>
        </div>
    </form>
</div>

<!-- Initialize Materialize JS for Selects -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    var elems = document.querySelectorAll('select');
    M.FormSelect.init(elems);
});
</script>

{% endblock %}
